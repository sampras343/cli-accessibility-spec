id: "CV-6"
domain: "color"
level: "AA"
testability: "AUTO"
spec_version: "1.0"
name: "--color Flag with Modes"
requires: [has_color_flag]
steps:
  - name: "Check --color=never suppresses color"
    exec:
      args: ["--color=never", "--help"]
    assert:
      exit_code: 0
      stdout_not_matches: ['\x1b\[(3[0-7]|9[0-7]|38;5;\d+|38;2;\d+;\d+;\d+)m']

  - name: "Check --color=always forces color in pipe"
    exec:
      args: ["--color=always", "--help"]
    assert:
      exit_code: 0
      stdout_matches: ['\x1b\[']
result_on_all_pass: "Supports"
result_on_any_fail: "Does Not Support"
