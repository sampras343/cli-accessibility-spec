id: "CV-3"
domain: "color"
level: "A"
testability: "AUTO"
spec_version: "1.0"
name: "--no-color Flag Support"
requires: [uses_color, has_color_flag]
steps:
  - name: "Color suppressed with --no-color flag"
    exec:
      args: ["--no-color", "--help"]
    assert:
      exit_code: 0
      stdout_not_matches: ['\x1b\[(3[0-7]|9[0-7]|38;5;\d+|38;2;\d+;\d+;\d+)m']
result_on_all_pass: "Supports"
result_on_any_fail: "Does Not Support"
