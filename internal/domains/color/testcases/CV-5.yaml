id: "CV-5"
domain: "color"
level: "A"
testability: "AUTO"
spec_version: "1.0"
name: "TERM=dumb Respect"
requires: [uses_color]
steps:
  - name: "No ANSI escape sequences with TERM=dumb"
    exec:
      args: ["--help"]
      env:
        TERM: "dumb"
    assert:
      exit_code: 0
      stdout_not_matches: ['\x1b']
result_on_all_pass: "Supports"
result_on_any_fail: "Does Not Support"
