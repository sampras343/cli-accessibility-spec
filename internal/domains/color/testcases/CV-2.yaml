id: "CV-2"
domain: "color"
level: "A"
testability: "AUTO"
spec_version: "1.0"
name: "NO_COLOR Support"
requires: [uses_color]
steps:
  - name: "Color suppressed with NO_COLOR=1"
    exec:
      args: ["--help"]
      env:
        NO_COLOR: "1"
    assert:
      exit_code: 0
      stdout_not_matches: ['\x1b\[(3[0-7]|9[0-7]|38;5;\d+|38;2;\d+;\d+;\d+)m']
result_on_all_pass: "Supports"
result_on_any_fail: "Does Not Support"
