id: "HD-1"
domain: "help"
level: "A"
testability: "AUTO"
spec_version: "1.0"
name: "--help and -h Flags"
steps:
  - name: "--help produces help output"
    exec:
      args: ["--help"]
    assert:
      exit_code: 0
      stdout_empty: false
  - name: "-h produces help output"
    exec:
      args: ["-h"]
    assert:
      exit_code: 0
      stdout_empty: false
result_on_all_pass: "Supports"
result_on_any_fail: "Does Not Support"
